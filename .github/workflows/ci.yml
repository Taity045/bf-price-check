name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"
  LIVE_URL: https://bf-price-check.tm-deal-lab.workers.dev
  CUSTOM_DOMAIN_URL: https://eish.veldwire.com

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: python3 build.py
      - name: Unit tests
        run: npm test
      - name: Start the worker locally (wrangler dev, local D1)
        run: |
          npx wrangler d1 execute bf-price-check-db --local --file schema.sql > /dev/null
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 --show-interactive-dev-session=false > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/; then echo "worker ready after ${i}s"; exit 0; fi
            sleep 1
          done
          cat wrangler-dev.log; exit 1
      - name: Browser tests (desktop and phone)
        run: npm run test:e2e -- http://127.0.0.1:8787
        env:
          CHROME: /usr/bin/google-chrome
          SHOTS: e2e-artifacts
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            wrangler-dev.log
          retention-days: 7
          if-no-files-found: ignore

  cloudflare-token:
    name: Cloudflare token permissions
    # Read-only report of what the deploy token can do. Never blocks a merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/cf_token_check.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # One deploy at a time; a deploy that has started always finishes.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check token permissions
        id: token
        run: node scripts/cf_token_check.mjs
      - name: Apply D1 schema
        # schema.sql only has CREATE ... IF NOT EXISTS, so running it again is safe.
        if: steps.token.outputs.d1_edit == 'true'
        run: npx wrangler d1 execute bf-price-check-db --remote --file schema.sql --yes
      - name: D1 schema step skipped
        if: steps.token.outputs.d1_edit != 'true'
        run: echo "::notice title=D1 schema skipped::The Cloudflare token has no D1 Edit permission. The worker creates its tables itself (CREATE TABLE IF NOT EXISTS), so the deploy goes ahead."
      - name: Deploy
        run: npx wrangler deploy
      - name: Smoke test (workers.dev)
        run: node tests/smoke.mjs "$LIVE_URL"
      - name: Smoke test (custom domain)
        run: node tests/smoke.mjs "$CUSTOM_DOMAIN_URL"
      - name: Report a failed deploy
        if: failure()
        run: echo "::error title=Deploy or smoke test failed::The live site may be broken. Check the steps above, then revert or fix main."
