name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"
  LIVE_URL: https://bf-price-check.tm-deal-lab.workers.dev
  CUSTOM_DOMAIN_URL: https://eish.veldwire.com
  STATS_URL: https://stats.veldwire.com

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: python3 build.py
      - name: Unit tests
        run: npm test
      - name: Start the worker locally (wrangler dev, local D1)
        run: |
          # A throwaway test key so the browser tests are not rate limited (local worker only).
          key=$(openssl rand -hex 16); echo "::add-mask::$key"
          echo "E2E_KEY=$key" > .dev.vars; echo "E2E_KEY=$key" >> "$GITHUB_ENV"
          # Local only: open the stats dashboard at /__stats without Access, and count test traffic.
          printf 'STATS_DEV=1\nSTATS_COUNT_E2E=1\n' >> .dev.vars
          # The Workers AI binding needs a Cloudflare login in wrangler dev, and this job has none: the local
          # worker runs without it, so the browser tests check the rules-only fallback (unit tests fake env.AI).
          python3 scripts/strip_ai_binding.py wrangler.toml
          npx wrangler d1 execute bf-price-check-db --local --file schema.sql > /dev/null
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 --show-interactive-dev-session=false > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/; then echo "worker ready after ${i}s"; exit 0; fi
            sleep 1
          done
          cat wrangler-dev.log; exit 1
      - name: Browser tests (desktop and phone)
        run: npm run test:e2e -- http://127.0.0.1:8787
        env:
          CHROME: /usr/bin/google-chrome
          SHOTS: e2e-artifacts
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            wrangler-dev.log
          retention-days: 7
          if-no-files-found: ignore

  cloudflare-token:
    name: Cloudflare token permissions
    # Read-only report of what the deploy token can do. Never blocks a merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/cf_token_check.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # One deploy at a time; a deploy that has started always finishes.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check token permissions
        id: token
        run: node scripts/cf_token_check.mjs
      - name: Apply D1 schema
        # schema.sql only has CREATE ... IF NOT EXISTS, so running it again is safe.
        if: steps.token.outputs.d1_edit == 'true'
        run: npx wrangler d1 execute bf-price-check-db --remote --file schema.sql --yes
      - name: D1 schema step skipped
        if: steps.token.outputs.d1_edit != 'true'
        run: echo "::notice title=D1 schema skipped::The Cloudflare token has no D1 Edit permission. The worker creates its tables itself (CREATE TABLE IF NOT EXISTS), so the deploy goes ahead."
      - name: Deploy
        # If a deploy with the Workers AI binding fails (for example the token has no Workers AI permission),
        # deploy again without it: compare then uses the rules only, and the site stays up.
        run: |
          if npx wrangler deploy; then exit 0; fi
          echo "::warning title=Deployed without Workers AI::The deploy with the [ai] binding failed. Deploying again without it; compare uses the rules only. Give the token Account > Workers AI > Read, then run the deploy again."
          python3 scripts/strip_ai_binding.py wrangler.toml
          npx wrangler deploy
      - name: Archive loader key (worker secret, set once)
        # The key for POST /api/admin/archive-load (src/archive.js). Without it the endpoint answers 404.
        env:
          ARCHIVE_LOAD_KEY: ${{ secrets.ARCHIVE_LOAD_KEY }}
        run: |
          if [ -z "$ARCHIVE_LOAD_KEY" ]; then echo "ARCHIVE_LOAD_KEY secret not set; the archive load endpoint stays off."; exit 0; fi
          if npx wrangler secret list 2>/dev/null | grep -q '"ARCHIVE_LOAD_KEY"'; then echo "Archive loader key already set."; else printf '%s' "$ARCHIVE_LOAD_KEY" | npx wrangler secret put ARCHIVE_LOAD_KEY > /dev/null && echo "Archive loader key set."; fi
      - name: Smoke test (workers.dev)
        run: node tests/smoke.mjs "$LIVE_URL"
      - name: Smoke test (custom domain)
        run: node tests/smoke.mjs "$CUSTOM_DOMAIN_URL"
      - name: Stats host stays private
        run: node tests/stats_smoke.mjs "$STATS_URL" "$CUSTOM_DOMAIN_URL"
      - name: Report a failed deploy
        if: failure()
        run: echo "::error title=Deploy or smoke test failed::The live site may be broken. Check the steps above, then revert or fix main."
