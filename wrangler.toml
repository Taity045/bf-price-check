name = "bf-price-check"
main = "dist/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# eish = the site. stats = private dashboard (Cloudflare Access + JWT check in src/stats.js).
# Keep eish first: wrangler dev uses the first route as the local host name.
routes = [
  { pattern = "eish.veldwire.com", custom_domain = true },
  { pattern = "stats.veldwire.com", custom_domain = true },
]
preview_urls = false

[build]
command = "python3 build.py"

# Daily price saving (src/daily.js): a small batch every minute, to stay inside the Free plan's
# 10 ms CPU and 50 subrequests per run. Housekeeping runs at minute 15 every 6 hours.
[triggers]
crons = ["* * * * *"]

# Workers Logs: lets you see each run's one-line summary ({"daily": ...}) in the dashboard.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "bf-price-check-db"
database_id = "65e86f16-42db-4c07-bbd7-20ba0308d47e"

# Email: sends from an address on the Cloudflare zone that has Email Routing on.
# The owner address is a secret (OWNER_EMAIL), never in this file.
[[send_email]]
name = "EMAIL"

# Rate limits per visitor (or per shop for cmpshop), per minute. Workers Rate Limiting API: counts
# are kept per Cloudflare location and are approximate, and they write nothing to D1.
# Same numbers as RL in src/worker.js and CMP_* in src/compare.js. namespace_id: any number unique
# in the account.
[[ratelimits]]
name = "RL_CHECK"
namespace_id = "7101"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_SNAP"
namespace_id = "7102"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_REQ"
namespace_id = "7103"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_VERDICT"
namespace_id = "7104"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "RL_OTHERS"
namespace_id = "7105"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_CMP_IP"
namespace_id = "7106"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "RL_CMP_SHOP"
namespace_id = "7107"
simple = { limit = 30, period = 60 }

# Compare searches at shops whose robots.txt asks for 10 s between requests (Pick n Pay, Clicks).
[[ratelimits]]
name = "RL_CMP_SLOW"
namespace_id = "7108"
simple = { limit = 6, period = 60 }

# Product search by name (src/search.js, /api/search): searches per visitor per minute.
[[ratelimits]]
name = "RL_SEARCH"
namespace_id = "7109"
simple = { limit = 30, period = 60 }

# Workers AI (src/compare.js, cmpAiJudge): a small model checks only borderline compare matches.
# Free plan: 10,000 Neurons per day; the worker stops at CMP_AI_DAILY calls per day (about 4,500 Neurons).
# Without this binding (or with AI_MATCH = "off"), compare uses the rules only. In `wrangler dev` the binding
# needs Cloudflare login; CI's local test worker has no login, so it tests the rules-only fallback.
[ai]
binding = "AI"

[vars]
SITE_URL = "https://bf-price-check.tm-deal-lab.workers.dev"
MAIL_FROM = "no-reply@veldwire.com"
ALERTS = "off"
AI_MATCH = "on"   # "off" = compare uses the rules only (no Workers AI calls)
WALL = "off"   # turn on when there are at least ~10 real fake-discount catches from ZA/UK shops
