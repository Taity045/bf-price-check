name = "bf-price-check"
main = "dist/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# eish = the site. stats = private dashboard (Cloudflare Access + JWT check in src/stats.js).
# Keep eish first: wrangler dev uses the first route as the local host name.
routes = [
  { pattern = "eish.veldwire.com", custom_domain = true },
  { pattern = "stats.veldwire.com", custom_domain = true },
]
preview_urls = false

[build]
command = "python3 build.py"

# Daily price saving (src/daily.js): a small batch every minute, to stay inside the Free plan's
# 10 ms CPU and 50 subrequests per run. Housekeeping runs at minute 15 every 6 hours.
[triggers]
crons = ["* * * * *"]

# Workers Logs: lets you see each run's one-line summary ({"daily": ...}) in the dashboard.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "bf-price-check-db"
database_id = "65e86f16-42db-4c07-bbd7-20ba0308d47e"

# Email: sends from an address on the Cloudflare zone that has Email Routing on.
# The owner address is a secret (OWNER_EMAIL), never in this file.
[[send_email]]
name = "EMAIL"

[vars]
SITE_URL = "https://bf-price-check.tm-deal-lab.workers.dev"
MAIL_FROM = "no-reply@veldwire.com"
ALERTS = "off"
WALL = "off"   # turn on when there are at least ~10 real fake-discount catches from ZA/UK shops
